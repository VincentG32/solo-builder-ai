# =============================================================================
# Canvas YAML — Exemple : CV Interactif Vincent
# =============================================================================
# Cas test RÉTROACTIF : on documente ce qui aurait dû être produit par le système
# si le projet avait été passé au pipeline complet.
#
# Projet réel : ~/projects/cv/ déployé sur vincent-granouillit.vercel.app
# Stack actuelle : Astro + Vercel
# =============================================================================

meta:
  project_id: cv-interactif
  project_name: "CV Interactif Vincent"
  description: "Site CV/portfolio personnel avec atelier de variantes (versions par cible : ScrumMaster, Coach Agile, Chef de Projet, Delivery Manager)."
  created_at: "2026-04-01T09:00:00+02:00"
  owner: Vincent
  mode: perso
  data_classification_max: public      # CV en ligne, données publiques
  discovery_mode: express              # idée claire, pas de marché à challenger
  discovery_mode_forced: false         # Coach a proposé Express, j'ai validé
  status: livre
  current_sprint: null
  last_updated_by: agent_sentinel
  last_updated_at: "2026-05-11T08:30:00+02:00"
  tags: [web, jamstack, portfolio, single-user]

# -----------------------------------------------------------------------------
# decisions — Journal court (mode perso = essentiel uniquement)
# -----------------------------------------------------------------------------
decisions:
  - id: 1
    timestamp: "2026-04-01T10:15:00+02:00"
    phase: discovery
    type: validation
    decision_systeme: "Mode Discovery Express recommandé (score 0/7)"
    choix_humain: "Validé Express"
    justification: "Idée claire, cible = moi-même + recruteurs, pas de concurrent à analyser"
    agent_concerne: coach

  - id: 2
    timestamp: "2026-04-01T11:00:00+02:00"
    phase: gtm
    type: forçage
    decision_systeme: "Stack proposée par TECH-ADVISOR : Next.js + Vercel (Tier 3)"
    choix_humain: "Forcé Astro + Vercel (Tier 2)"
    justification: "Astro plus simple à maintenir en solo non-dev, build statique pur, je connais déjà"
    agent_concerne: tech_advisor

  - id: 3
    timestamp: "2026-04-15T16:30:00+02:00"
    phase: delivery
    type: ajustement
    decision_systeme: "Atelier de variantes proposé en Should (sprint 2)"
    choix_humain: "Remonté en Must (sprint 1)"
    justification: "Différenciant fort vs CV classique, mérite d'être dans le MVP"
    agent_concerne: pm

# -----------------------------------------------------------------------------
# discovery — Mode Express (Coach seul, pas d'EMBER+RAZOR/CONTRARIAN/JUDGE)
# -----------------------------------------------------------------------------
discovery:
  brief_initial: |
    Je veux un site CV en ligne qui se démarque. Mes profils sont multiples
    (Scrum Master, Coach Agile, Chef de projet, Delivery Manager). Je veux
    pouvoir présenter une variante adaptée à chaque type de recruteur.

  coach_interview:
    questions:
      - q: "Y a-t-il des utilisateurs autres que toi (recruteurs comptent comme utilisateurs externes) ?"
        a: "Oui — recruteurs FR + Suisse"
      - q: "Le projet a-t-il des contraintes légales (RGPD, fiscal, santé) ?"
        a: "RGPD basique uniquement (formulaire de contact)"
      - q: "Y a-t-il un marché concurrentiel à challenger ?"
        a: "Pas vraiment — c'est un CV, chacun fait le sien"
      - q: "As-tu besoin d'arguments pour convaincre (investisseur, partenaire) ?"
        a: "Non, c'est pour ma marque perso"
      - q: "L'idée est-elle claire dans ta tête ?"
        a: "Très claire"
      - q: "Y a-t-il un budget significatif engagé (temps ou argent) ?"
        a: "Quelques jours max, hosting gratuit"
      - q: "Délai serré ?"
        a: "Non mais préfère pas traîner"
    diagnostic:
      enjeu: faible
      cible: externe
      contraintes_legales: false       # RGPD basique = pas un facteur majeur
      marche_concurrentiel: false
      budget_significatif: false
      score_total: 0                   # +1 cible externe, -1 délai non serré (au global pas pivot)
      mode_recommande: express
      mode_choisi: express
    security_flags: []

  # Pas d'EMBER+RAZOR en mode Express
  ember_razor_output: null
  contrarian_output: null
  judge_verdict: null

# -----------------------------------------------------------------------------
# tech_advisor — Stack proposée, mais forçage par moi
# -----------------------------------------------------------------------------
tech_advisor:
  skipped: false
  stack_proposees:
    - tier: 2
      name: "Astro + Vercel"
      pros:
        - "Build statique, performance native"
        - "Très simple à maintenir en solo non-dev"
        - "Hosting gratuit Vercel"
        - "Accessibilité native bonne (HTML sémantique)"
      cons:
        - "Pas de backend (limitant si features dynamiques futures)"
      estimated_cost_monthly_eur: 0
      maintenance_complexity_for_non_dev: low
    - tier: 3
      name: "Next.js + Vercel"
      pros:
        - "Plus de flexibilité (API routes possibles)"
        - "Écosystème React riche"
        - "Hosting gratuit Vercel"
      cons:
        - "Complexité supérieure pour un cas d'usage statique"
        - "Bundle JS plus lourd (perf moins bonne sans SSG strict)"
      estimated_cost_monthly_eur: 0
      maintenance_complexity_for_non_dev: medium
    - tier: 1
      name: "HTML statique pur + Netlify"
      pros:
        - "Ultra simple"
        - "Performance maximale"
      cons:
        - "Pas de composants réutilisables → atelier de variantes plus dur"
        - "Maintenance plus pénible quand ça grossit"
      estimated_cost_monthly_eur: 0
      maintenance_complexity_for_non_dev: low

  stack_choisie:
    tier: 2
    name: "Astro + Vercel"
    composants:
      frontend: "Astro 4.x"
      backend: null
      database: null
      hosting: "Vercel (free tier)"
      monitoring: "Vercel Analytics + Lighthouse CI"
      other:
        - "GitHub pour le repo"
        - "Tailwind CSS pour le styling"
    forcee_par_user: true              # j'ai choisi Astro après que TECH-ADVISOR ait proposé en premier Next.js
    justification_forcage: "Recommandation initiale était Next.js. J'ai préféré Astro pour la simplicité de maintenance solo non-dev."

# -----------------------------------------------------------------------------
# gtm — Phase légère en mode perso/Express
# -----------------------------------------------------------------------------
gtm:
  strategie:
    cible: "Recruteurs IT/Agile FR + Suisse cherchant un profil PM/PO senior"
    canal_principal: "Lien direct dans candidatures + LinkedIn profil"
    canaux_secondaires:
      - "Signature email"
      - "Partage réseau professionnel"
    positionnement: "Profil multi-casquettes (SM/Coach/PM/DM) avec adaptabilité prouvée par variante"
    prix: gratuit                      # CV, pas un produit
    timing: "Disponible H24, mis à jour à chaque nouvelle mission"
    risques_canal: "Aucun — multi-canal et basse intensité"

  mvp_scope:
    must:
      - feature: "Landing avec profil principal"
        description: "Première page avec présentation, parcours, expertises"
        acceptance: "Recruteur comprend mon profil en < 30 secondes"
      - feature: "4 variantes du CV (SM / Coach / PM / DM)"
        description: "Atelier de variantes — chaque profil a sa version optimisée"
        acceptance: "Recruteur arrive sur la bonne variante via lien direct"
      - feature: "Formulaire de contact"
        description: "RGPD-compliant, pas de spam"
        acceptance: "Email reçu, accusé envoyé"
    should:
      - feature: "Téléchargement PDF par variante"
        description: "Génération PDF côté serveur (ou statique pré-généré)"
        acceptance: "PDF cohérent avec la version web"
      - feature: "Mode sombre"
        description: "Toggle dark/light"
        acceptance: "Persistance entre visites"
    later:
      - feature: "Blog / notes courtes"
        description: "Pour démontrer la veille / production de contenu"
        acceptance: "1 article par mois minimum"
      - feature: "Multilangue (FR/EN)"
        description: "Suisse alémanique = marché potentiel"
        acceptance: "Switch propre, contenu équivalent"

  metric_setter:
    kpis:
      - name: "Visites uniques mensuelles"
        description: "Nombre de visites uniques par mois"
        target_value: 50               # objectif modeste, CV pas produit
        measurement_window: "Mensuel"
      - name: "Taux de rebond"
        description: "% de visites qui repartent sans interaction"
        target_value: 50               # acceptable pour un CV
        measurement_window: "Mensuel"
      - name: "Time on page (landing)"
        description: "Durée moyenne sur la landing"
        target_value: 60               # 1 minute = bon signal
        measurement_window: "Mensuel"
      - name: "Mentions du site dans messages recruteurs"
        description: "Recruteurs qui mentionnent avoir vu le site"
        target_value: "1 par mois"
        measurement_window: "Mensuel"
    pivot_criteria:
      - "Visites < 10/mois pendant 3 mois → reposer la question de l'utilité du site"
      - "Aucune mention recruteur en 6 mois → revoir SEO et canal de diffusion"
    persevere_criteria:
      - "Visites > 30/mois ET mentions ≥ 1/mois → continuer, ajouter Should"

# -----------------------------------------------------------------------------
# delivery — 1 sprint historique (livraison initiale)
# -----------------------------------------------------------------------------
delivery:
  sprints:
    - sprint_id: 1
      start_at: "2026-04-02T09:00:00+02:00"
      end_at: "2026-04-12T18:00:00+02:00"
      goal: "MVP — landing + 4 variantes + formulaire contact"

      pm_output:
        stories:
          - id: STORY-1
            title: "Landing principale"
            bdd_scenario: |
              Étant donné qu'un recruteur arrive sur vincent-granouillit.vercel.app
              Quand il atterrit sur la landing
              Alors il voit en < 5 secondes : nom, titre principal, 4 chevrons vers variantes, lien contact
            acceptance_criteria:
              - "Lighthouse Perf ≥ 90"
              - "Lighthouse Accessibility ≥ 95"
              - "Temps premier paint < 1s"
            priority: must
          - id: STORY-2
            title: "Variante Scrum Master"
            bdd_scenario: |
              Étant donné qu'un recruteur est sur la landing
              Quand il clique sur le chevron Scrum Master
              Alors il arrive sur /scrum-master avec un contenu optimisé pour ce profil
            acceptance_criteria:
              - "URL /scrum-master propre"
              - "Contenu différencié de la landing"
              - "Bouton retour landing présent"
            priority: must
          # ... STORY-3 à STORY-6 (autres variantes + contact)
        tickets: []

      dev_output:
        code_repo: "https://github.com/VincentG32/cv"
        branches: ["main"]
        commits: ["..."]              # SHAs réels
        tests_unit_coverage: 0.0      # site statique, pas de tests unitaires pertinents
        tests_integration_status: green  # Lighthouse CI = "integration" implicite

      audit_tech_report:
        securite: green               # HTML statique, surface d'attaque minimale
        qualite_code: green           # ESLint + Prettier + Astro check
        accessibilite: green          # axe-core RGAA AA passé
        scalabilite: n/a              # site statique, Vercel CDN
        performance: green            # Lighthouse Perf 95+
        privacy: green                # pas de cookies tracking, RGPD basique OK
        details_url: "https://github.com/VincentG32/cv/actions"
        blocking_issues: []

      qa_e2e_report:
        scenarios_count: 4
        scenarios_passed: 4
        screenshots_url: "https://github.com/VincentG32/cv/tree/main/.qa/screenshots"
        videos_url: null              # pas de vidéos pour un site statique simple

      deploy_output:
        deployed_at: "2026-04-12T18:30:00+02:00"
        delivery_url: "https://vincent-granouillit.vercel.app"
        deployment_method: auto       # push GitHub → Vercel déploie
        rollback_available: true      # Vercel garde les déploiements précédents

      sprint_review:
        completion_percentage: 1.0
        blockers_encountered: []
        decisions_logged: [3]

