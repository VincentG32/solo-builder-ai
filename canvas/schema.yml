# =============================================================================
# Canvas YAML — Schéma annoté (modèle vide)
# =============================================================================
# Ce fichier décrit la structure complète d'un Canvas de projet.
# À utiliser comme référence pour créer un nouveau projet (canvas/projects/<id>.yml).
#
# Conventions :
#   - Les champs `null` doivent être remplis par l'agent ou par moi au moment voulu
#   - Les champs entre `<...>` sont des types attendus
#   - Les commentaires expliquent le rôle, qui écrit, et quand
# =============================================================================

# -----------------------------------------------------------------------------
# meta — Identité du projet (rempli au démarrage)
# Écrit par : moi (création) + Orchestrateur (mises à jour de status uniquement)
# -----------------------------------------------------------------------------
meta:
  project_id: <string>              # ex: cv-interactif, apport-affaires
  project_name: <string>            # ex: "CV Interactif Vincent"
  description: <string>             # 1-2 phrases résumé du projet
  created_at: <ISO 8601 datetime>
  owner: Vincent

  # Mode immuable une fois posé (cf perso-profile.md)
  mode: <enum: client | perso>

  # Classification immuable une fois posée (cf data-classification.md)
  data_classification_max: <enum: public | interne | sensible | critique>

  # Mode Discovery (proposé par Coach, validé ou forcé par moi)
  discovery_mode: <enum: express | standard | complet>
  discovery_mode_forced: <bool>     # true si j'ai forcé un autre choix que la reco Coach

  # État courant
  status: <enum: discovery | gtm | tech_advisor | delivery | feedback | livre | archive>  # ordre du pipeline : GTM avant TECH-ADVISOR
  current_sprint: <int | null>

  # Métadonnées de mise à jour (pour traçabilité)
  last_updated_by: <string>         # nom de l'agent ou "vincent"
  last_updated_at: <ISO 8601 datetime>

  # Tags libres (optionnel)
  tags: []                          # ex: [web, mobile, no-code, b2c]

# -----------------------------------------------------------------------------
# decisions — Journal des décisions humaines structurantes
# Écrit par : Orchestrateur à chaque checkpoint
# Inclut : validations, ajustements, forçages, pivots
# -----------------------------------------------------------------------------
decisions: []
  # Format d'une entrée :
  # - id: <int>                     # incrément
  #   timestamp: <ISO 8601>
  #   phase: <enum: discovery | gtm | delivery | feedback>
  #   type: <enum: validation | ajustement | forçage | pivot>
  #   decision_systeme: <string>    # ce que le système proposait
  #   choix_humain: <string>        # ce que j'ai retenu
  #   justification: <string>       # ma raison (texte libre, surtout pour forçage/pivot)
  #   agent_concerne: <string>      # nom de l'agent qui avait proposé
  # Convention (cf agents/contrarian.md, section 11) : un fatal_flaw est résolu par une entrée
  # validation, ajustement ou pivot, phase discovery, agent_concerne CONTRARIAN, dont
  # decision_systeme commence par son id (ex : "FF-ECO-01 : ...").

# -----------------------------------------------------------------------------
# discovery — Phase Discovery (modulaire selon mode)
# -----------------------------------------------------------------------------
discovery:
  # Brief initial — court (3-10 lignes), rempli par moi
  brief_initial: <string>

  # Sortie du Coach (toujours présente)
  coach_interview:
    questions: []
      # - q: <string>
      #   a: <string>
      #   category: <enum: enjeu | cible | contraintes_legales | marche | clarte | budget | delai | domaine_specifique>
    diagnostic:
      enjeu: <enum: faible | modere | fort>
      cible: <enum: moi | externe>
      contraintes_legales: <bool>
      marche_concurrentiel: <bool>
      budget_significatif: <bool>
      score_total: <int>
      mode_recommande: <enum: express | standard | complet>
      mode_choisi: <enum: express | standard | complet>
      forced: <bool>
      justification_forcage: <string | null>
    summary_brief_enrichi: <string>           # lu par EMBER+RAZOR, CONTRARIAN, JUDGE, GTM, TECH-ADVISOR
    angles_morts_detectes: [<string>]
    questions_recommandees_pour_la_suite: [<string>]
    security_flags: []              # codes de prompt-injection-defense.md

  # Sortie EMBER+RAZOR (présent uniquement en mode Complet), cf agents/ember-razor.md
  ember_razor_output: null
  # Format quand présent :
  #   pitch: <string>
  #   preuves_positives:
  #     - source: <enum: reddit | hacker_news | g2 | product_hunt | crunchbase | failory | linkedin_public | data_gouv | insee>
  #       url: <string>               # citation, https, domaine de l'allowlist
  #       date: <ISO 8601 date>
  #       date_type: <enum: publication | consultation>
  #       claim: <string>
  #   preuves_negatives: [...]        # même format que preuves_positives
  #   concurrents_morts:
  #     - nom: <string>
  #       cause_echec: <string>
  #       source: <preuve>            # même format que preuves_positives
  #   lacunes: [<string>]
  #   requetes_web_utilisees: <int 0-20>
  #   security_flags: []

  # Sortie CONTRARIAN (présent en mode Standard ou Complet), cf agents/contrarian.md
  contrarian_output: null
  # Format quand présent :
  #   fatal_flaws:                    # 3 au moins, sinon absence_fatal_flaws_explication
  #     - id: <string>                # FF-<JUR|FIS|OPE|DEP|ECO|AUT>-<nn>
  #       categorie: <enum: juridique | fiscal | operationnel | dependance_externe | modele_economique | autre>
  #       gravite: <enum: bloquante | majeure>
  #       titre: <string>
  #       description: <string>
  #       si_ca_arrive: <string>
  #       references: [{type: <enum: brief | angle_mort_coach | question_coach | preuve_ember_razor>, ref: <string>}]
  #       question_de_resolution: <string>
  #       a_verifier: <string | null>  # obligatoire pour juridique et fiscal
  #   absence_fatal_flaws_explication: <string | null>
  #   hidden_assumptions: [{id: HA-<nn>, categorie, hypothese, risque_si_fausse, references}]
  #   stress_test_questions: [{id: ST-<nn>, question, cible_id: <FF-... | HA-... | null>}]
  #   limites_analyse: [<string>]
  #   security_flags: []

  # Verdict JUDGE (présent en mode Standard ou Complet), cf agents/judge.md
  judge_verdict: null
  # Format quand présent :
  #   verdict: <enum: go | no_go | pivot>   # no_go aussi si un élément manque (preuve_absente)
  #   gates_passed: [<gate>]          # les 5 gates G1_CIBLE..G5_FATAL_FLAWS, chacune une seule fois
  #   gates_failed: [<gate>]
  #     # gate : {id, justification, elements_canvas: [{chemin, extrait}], preuve_absente: <bool>}
  #   raison: <string>
  #   angle_a_revoir: <string | null>        # pivot uniquement
  #   fatal_flaws_non_resolus: [<FF-id>]
  #   fatal_flaws_forces: [<FF-id>]          # sous-ensemble des non résolus (forçage tracé)
  #   security_flags: []

# -----------------------------------------------------------------------------
# tech_advisor — Choix de la stack technique
# Écrit par : Agent TECH-ADVISOR (skippable si stack forcée par moi)
# -----------------------------------------------------------------------------
tech_advisor:
  skipped: <bool>                   # true si stack imposée par moi dès le brief
  # Autres champs de la sortie (cf agents/tech-advisor.md) : skip_reason, recommandation_par_defaut_index,
  # raisonnement, alerts, security_flags ; une stack proposée porte aussi compatible_with_classification et composants
  stack_proposees: []
    # - tier: <int 0-5>
    #   name: <string>              # ex: "Airtable + Make + Yousign"
    #   pros: [<string>]
    #   cons: [<string>]
    #   estimated_cost_monthly_eur: <number>
    #   maintenance_complexity_for_non_dev: <enum: low | medium | high>
  stack_choisie:
    tier: <int>
    name: <string>
    composants:
      frontend: <string | null>
      backend: <string | null>
      database: <string | null>
      hosting: <string | null>
      monitoring: <string | null>
      other: []
    forcee_par_user: <bool>
    justification_forcage: <string | null>

# -----------------------------------------------------------------------------
# gtm — Phase Go-to-Market (3 modes : Stratégie, MVP Scoper, Metric Setter)
# Écrit par : Agent GTM
# -----------------------------------------------------------------------------
gtm:
  # Champs de contrôle de GTM (skipped, skip_reason, format_sortie, security_flags) : hors Canvas, cf agents/gtm.md
  strategie:
    cible: <string>                 # contient "Volume estimé : <nombre> ..." (lu par TECH-ADVISOR)
    canal_principal: <string>
    canaux_secondaires: []
    positionnement: <string>
    prix: <string>                  # ou "gratuit"
    timing: <string>
    risques_canal: <string>         # toujours rempli, même si le risque est faible

  mvp_scope:
    must: []                        # à livrer sprint 1
      # - feature: <string>
      #   description: <string>
      #   acceptance: <string>
    should: []                      # sprint 2-3, même format que must
    later: []                       # après validation MVP, même format que must

  metric_setter:
    kpis: []
      # - name: <string>
      #   description: <string>
      #   target_value: <number | string>
      #   measurement_window: <string>  # ex: "7 jours après livraison"
    pivot_criteria: []              # [<string>] : KPI + comparateur + seuil chiffré, gelés au checkpoint GTM
    persevere_criteria: []          # [<string>] : même format

# -----------------------------------------------------------------------------
# delivery — Phase Delivery itérative (1 sprint = 1 incrément)
# Écrit par : Agents PM / Dev / Audit Tech / QA E2E / DEPLOY
# -----------------------------------------------------------------------------
delivery:
  sprints: []
    # sprints[N] désigne le sprint dont sprint_id = N (pas la position dans la liste).
    # Les champs de contrôle des agents (status, verdict, alerts, security_flags, etc.) restent dans l'état
    # de l'Orchestrateur, hors Canvas : voir la section 4 de chaque spec.
    # Format d'un sprint :
    # - sprint_id: <int>
    #   start_at: <ISO 8601>             # écrit par l'Orchestrateur à l'ouverture du sprint
    #   end_at: <ISO 8601 | null>        # écrit par l'Orchestrateur à la clôture du sprint
    #   goal: <string>
    #
    #   pm_output:
    #     stories: []
    #       # - id: <string>                # S<sprint>-<nn>, stable
    #       #   title: <string>
    #       #   gtm_feature: <string>         # nom exact de la feature de gtm.mvp_scope
    #       #   origin: <enum: nouveau | reporte>
    #       #   bdd_scenario: <string>      # Gherkin
    #       #   acceptance_criteria: [<string>]  # exactement 1 élément
    #       #   priority: <enum: must | should | later>
    #       #   qa_critical_path: <bool>      # 5 au plus par sprint, lus par QA E2E
    #     tickets: []                       # exactement 1 ticket par story
    #       # - id: <string>                # T-<id story>
    #       #   story_id: <string>
    #       #   title: <string>
    #       #   order: <int 1-7>
    #       #   depends_on: [<ticket id>]
    #
    #   dev_output:
    #     code_repo: <url>
    #     branches: [<string>]             # dev/sprint-<n> ou dev/sprint-<n>-fix-<k>
    #     commits: [<sha>]
    #     tests_unit_coverage: <float>     # 0.0 à 1.0
    #     tests_integration_status: <enum: green | orange | red>
    #
    #   audit_tech_report:
    #     securite: <enum: green | orange | red>
    #     qualite_code: <enum: green | orange | red>
    #     accessibilite: <enum: green | orange | red | n/a>  # axe-core / Pa11y (n/a sans interface)
    #     scalabilite: <enum: green | orange | red | n/a>  # k6
    #     performance: <enum: green | orange | red | n/a>  # Lighthouse (n/a sans interface)
    #     privacy: <enum: green | orange | red>            # cookie scanner
    #     details_url: <string>            # rapport détaillé (https:// ou file:///)
    #     blocking_issues: [<string>]      # "[SEC-01] message métier (localisation, règle)", un par constat rouge
    #
    #   rework_items: [<string>]           # liste de reprise du sprint, remplie par l'Orchestrateur : constats
    #                                      # rouges d'Audit Tech, points orange retenus par Vincent, points
    #                                      # [E2E-<story>] de QA E2E ; lue par Dev en rework
    #
    #   qa_e2e_report:
    #     scenarios_count: <int>           # 3-5 max (rapport absent si QA E2E skippé : "pas de recette")
    #     scenarios_passed: <int>
    #     screenshots_url: <string>
    #     videos_url: <string>
    #
    #   deploy_output:
    #     deployed_at: <ISO 8601 | null>
    #     delivery_url: <string | null>
    #     deployment_method: <enum: auto | manual>   # manual = go explicite de Vincent (client)
    #     rollback_available: <bool>       # une version précédente restaurable existait avant ce déploiement
    #     health_check_status: <enum: green | red | not_run>
    #
    #   sprint_review:                   # écrit par l'Orchestrateur à la clôture du sprint
    #     completion_percentage: <float>
    #     blockers_encountered: [<string>]
    #     decisions_logged: [<int>]        # IDs des entrées decisions

# -----------------------------------------------------------------------------
# feedback — Boucle de feedback (synthétique avant livraison + réel après)
# -----------------------------------------------------------------------------
feedback:
  # Couche 1 — Synthétique (4 personas FR, avant livraison)
  synthetique: []
    # - sprint_id: <int>
    #   persona: <enum: dsi_pme | dirigeant_non_tech | dev_senior_sceptique | utilisateur_final_presse>
    #   session_at: <ISO 8601>
    #   observations: [<string>]
    #   signaux_alerte: [<string>]
    #   suggestions: [<string>]

  # Couche 2 — Réel (KPIs + verbatims, après livraison)
  # Écrit par : collecte analytics de l'Orchestrateur (jamais SENTINEL, qui n'écrit que sentinel_alerts)
  reel: []
    # - sprint_id: <int>
    #   kpi_name: <string>
    #   value_observed: <number>
    #   value_target: <number>
    #   measurement_window: <string>
    #   timestamp: <ISO 8601>
    #   source: <enum: analytics | nps | support_ticket | verbatim>

  # SENTINEL — alertes post-prod (réactives + proactives)
  sentinel_alerts: []
    # - timestamp: <ISO 8601>
    #   severity: <enum: info | warning | critical>
    #   type: <enum: downtime | fuite_donnees_potentielle | erreur_paiement | sentry_endpoint_critique |
    #          erreurs_serveur | performance | regression_post_deploiement | quota_hebergeur | certificat |
    #          limitation_debit | surveillance_degradee | nettoyage_logs>   # cf agents/sentinel.md
    #   message_metier: <string>       # langage non-tech
    #   action_taken_auto: <string | null>
    #   action_required_human: <string | null>

  # Insight Synthesizer — synthèse cross-couches
  insights_synthesizer_output: null
  # Format quand présent :
  #   sprint_id: <int>
  #   insights_priorises: []
  #     # - id: <int>
  #     #   summary: <string>
  #     #   confirmed_by: [<enum: synthetique | reel>]
  #     #   priority: <enum: haute | moyenne | basse>
  #     #   suggested_action: <string>
  #   recommandation_globale: <enum: backlog_next | pivot | persevere | discovery_relance>

# -----------------------------------------------------------------------------
# livrables — Artefacts générés par Agent Livrable (event-driven)
# Écrit par : Agent Livrable
# -----------------------------------------------------------------------------
livrables:
  generated: []
    # - type: <enum: impact_map | story_map | roadmap | sprint_review | audit_report | decision_log>
    #   version: <string>             # X.Y : 1.0 puis +0.1 à chaque régénération (calculé par l'Orchestrateur)
    #   version_exec_url: <string>    # version Exécutif (1 page, métier)
    #   version_tech_url: <string>    # version Technique (détaillée, IT)
    #   format: <enum: notion | html>   # le même pour les deux versions
    #   generated_at: <ISO 8601>
    #   trigger_event: <string>       # ce qui a déclenché la génération
    #   sprint_id: <int | null>       # null pour impact_map, story_map, roadmap, decision_log
