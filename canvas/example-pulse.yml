      kpi_name: "Users actifs"
      value_observed: 4
      value_target: 10
      measurement_window: "Première semaine post-livraison V1"
      timestamp: "2026-05-08T12:00:00+02:00"
      source: analytics
    - sprint_id: 5
      kpi_name: "Latence p95 API"
      value_observed: 280
      value_target: 500
      measurement_window: "Continu Sentry"
      timestamp: "2026-05-10T00:00:00+02:00"
      source: analytics

  sentinel_alerts:
    - timestamp: "2026-05-06T11:30:00+02:00"
      severity: warning
      type: "rate_limit_triggered"
      message_metier: "Un utilisateur a tenté 6 logins en 1 minute — limité automatiquement. Pas d'action requise."
